<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="인수받은 서비스의 경계와 소비자 구조를 나타낸 C4 컨테이너 다이어그램">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
      .name{ font-size: 14px; font-weight: 600; fill: #15181e; }
      .type{ font-size: 10.5px; fill: #8792a3; letter-spacing: .02em; }
      .desc{ font-size: 11.5px; fill: #4e5766; }
      .edge{ font-size: 11px; fill: #64748b; }
      .zone{ font-size: 11.5px; font-weight: 600; fill: #8792a3; letter-spacing: .04em; }
      .note{ font-size: 11.5px; fill: #64748b; }
      .noteb{ font-size: 11.5px; font-weight: 600; fill: #4e5766; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <!-- ── 소비자 ── -->
  <text x="40" y="34" class="t zone">소비자</text>

  <g>
    <rect x="40" y="50" width="220" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="150" y="76" class="t name" text-anchor="middle">A 팀 서비스</text>
    <text x="150" y="93" class="t type" text-anchor="middle">[외부 시스템]</text>
    <text x="150" y="112" class="t desc" text-anchor="middle">최대 소비자 · 실패 시 지연</text>
  </g>

  <g>
    <rect x="290" y="50" width="220" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="400" y="76" class="t name" text-anchor="middle">B 팀 서비스</text>
    <text x="400" y="93" class="t type" text-anchor="middle">[외부 시스템]</text>
    <text x="400" y="112" class="t desc" text-anchor="middle">결과 조회 · 실패 시 유실</text>
  </g>

  <g>
    <rect x="540" y="50" width="220" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="650" y="76" class="t name" text-anchor="middle">내부 운영자</text>
    <text x="650" y="93" class="t type" text-anchor="middle">[사람]</text>
    <text x="650" y="112" class="t desc" text-anchor="middle">조회 · 수동 운영 작업</text>
  </g>

  <!-- ── 소비자 → 컨테이너 ── -->
  <path d="M 150 128 L 195 225" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="132" y="172" class="t edge">수집 요청</text>

  <path d="M 400 128 L 255 225" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="172" class="t edge">조회</text>

  <path d="M 650 128 L 590 225" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="628" y="172" class="t edge">운영</text>

  <!-- ── 시스템 경계 ── -->
  <rect x="25" y="192" width="750" height="180" rx="12" fill="none" stroke="#b4bdc9" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="42" y="212" class="t zone">인수받은 서비스</text>

  <g>
    <rect x="60" y="225" width="320" height="115" rx="9" fill="#e7edfb" stroke="#1b45b0" stroke-width="1.5"/>
    <text x="220" y="258" class="t name" text-anchor="middle">수집 API</text>
    <text x="220" y="276" class="t type" text-anchor="middle">[컨테이너 · gRPC]</text>
    <text x="220" y="298" class="t desc" text-anchor="middle">초당 수천 건</text>
    <text x="220" y="318" class="t desc" text-anchor="middle" font-weight="600" fill="#1b45b0">티어 1</text>
  </g>

  <g>
    <rect x="420" y="225" width="320" height="115" rx="9" fill="#eef1f5" stroke="#7b8494" stroke-width="1.4"/>
    <text x="580" y="258" class="t name" text-anchor="middle">관리 화면</text>
    <text x="580" y="276" class="t type" text-anchor="middle">[컨테이너 · HTTP]</text>
    <text x="580" y="298" class="t desc" text-anchor="middle">하루 수십 건</text>
    <text x="580" y="318" class="t desc" text-anchor="middle" font-weight="600" fill="#4e5766">티어 2</text>
  </g>

  <!-- ── 컨테이너 → 의존 ── -->
  <path d="M 175 340 L 140 420" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 265 340 L 380 420" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 545 340 L 440 420" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- ── 의존 ── -->
  <text x="40" y="404" class="t zone">의존</text>

  <g>
    <rect x="40" y="420" width="190" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="135" y="446" class="t name" text-anchor="middle">메시지 큐</text>
    <text x="135" y="463" class="t type" text-anchor="middle">[인프라]</text>
    <text x="135" y="482" class="t desc" text-anchor="middle">수집 결과 발행</text>
  </g>

  <g>
    <rect x="270" y="420" width="260" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="400" y="446" class="t name" text-anchor="middle">데이터 저장소</text>
    <text x="400" y="463" class="t type" text-anchor="middle">[인프라 · 공유]</text>
    <text x="400" y="482" class="t desc" text-anchor="middle">다른 팀과 같은 인스턴스</text>
  </g>

  <!-- ── 주석 ── -->
  <line x1="570" y1="424" x2="570" y2="494" stroke="#dde2e9" stroke-width="1.2"/>
  <text x="588" y="442" class="t noteb">그림에서 확인한 것</text>
  <text x="588" y="462" class="t note">배포 단위가 둘, 티어도 둘</text>
  <text x="588" y="480" class="t note">저장소는 다른 팀과 공유</text>

  <line x1="40" y1="528" x2="760" y2="528" stroke="#e5e9ef" stroke-width="1.2"/>
  <text x="40" y="552" class="t noteb">A 팀은 실패 시 재시도로 지연되고, B 팀은 그 자리에서 유실돼요.</text>
  <text x="40" y="572" class="t note">같은 5분 장애라도 심각도가 다르고, 이 차이가 알럿의 긴급도를 정했어요.</text>
</svg>
